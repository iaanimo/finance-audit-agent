# 会计科目映射表
#
# 用途：把「发票上的货物/服务名称」映射到「报销费用类型」，再映射到「借方会计科目」。
#
# 为什么是查表而不是让 LLM 猜：
#   科目归类是记账行为，错了会让报表失真。查表的结果可复现、可审计，
#   而且能直接告诉复核人"我是根据哪条匹配到的"。
#   查不到时不是让模型编一个，而是标 WARN 交人工（制度 5.1）。

# 贷方科目：员工报销一律先挂"其他应付款"，待实际付款时冲销。
credit_account: 其他应付款-员工报销

# 进项税额科目。
# 凭证的借方会拆成「不含税金额 + 进项税额」两行，贷方仍是价税合计。
# 这么拆的意义：如果借方只写一行总额、金额又永远等于贷方，
# 那么 R013「借贷平衡」就成了恒真式，校验永远通过等于没校验。
input_tax_account: 应交税费-应交增值税（进项税额）

# expense_type 之间按顺序匹配，先命中先返回。
accounts:
  - expense_type: 市内交通费
    keywords: [客运服务, 打车, 网约车, 出租车, 公共交通, 地铁, 公交]
    debit_account: 管理费用-差旅费-市内交通费

  - expense_type: 住宿费
    keywords: [住宿, 房费, 客房, 酒店, 旅馆]
    debit_account: 管理费用-差旅费-住宿费

  - expense_type: 差旅费
    keywords: [火车票, 铁路, 机票, 航空运输, 客票]
    debit_account: 管理费用-差旅费-长途交通费

  - expense_type: 餐饮费
    keywords: [餐饮, 餐费, 工作餐, 业务招待, 食品]
    debit_account: 管理费用-业务招待费

  - expense_type: 会议费
    keywords: [会议服务, 会务, 展览服务]
    debit_account: 管理费用-会议费

  - expense_type: 办公用品
    keywords: [办公用品, 文具, 耗材, 打印, 纸张]
    debit_account: 管理费用-办公费

  - expense_type: 通讯费
    keywords: [话费, 通讯, 电信, 移动通信, 联通, 宽带]
    debit_account: 管理费用-通讯费

# 演示用：申请人所属部门 -> 科目后缀（决定挂管理费用还是销售费用）
# 未列出的部门一律走管理费用。
department_account_prefix:
  财务部: 管理费用
  人事部: 管理费用
  技术部: 管理费用
  销售部: 销售费用
