name: tests

# README 在讲"受控"这套主张时给出的证据是测试通过数。别人只能信你，
# 除非这里真的跑一遍 —— 所以这个文件的作用是：让那句话可以被验证。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 静态检查（ruff，只查 F 类）
        # 只查「正确性」那一层：未定义名 / 未使用 import / f-string 缺占位符。
        # 规则见仓库根的 ruff.toml —— 刻意不开风格规则、不上 mypy。
        # 这一步补的是测试看不见的一层：类型注解里的名字、以及被遮蔽的导入。
        # 用 `python -m ruff` 而不是裸 `ruff`：两个 runner 上都不用操心 PATH。
        run: |
          python -m pip install ruff
          python -m ruff check .

      - name: 单元测试（含四条不变量）
        # PYTHONIOENCODING：报告里有 ✅ 这类字符，Windows runner 默认 GBK 会炸
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: 离线评测（16 张样本 = 13 PDF + 3 XML，退出码即结论）
        # 这一步**不需要** Edge：样本 PDF 已随仓库提交，评测只读它们。
        # 误报、严重度不符、抽取不符都会让它返回非 0。
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_eval.py
